    <script> // 255 (1)
        'use strict';
        {
        function each(arr, callback) {
        	let result = [];

        	for (let elem of arr) {
        		result.push( callback(elem) );
        	}

        	return result;
        }

        let result = each([1, 2, 3, 4, 5], function(num) {
        	return num * 2;
        });

        console.log(result);
        }
    </script>

    <script> // 258
        'use strict';
        {
        function filter(arr, callback) {
        	let res = [];

        	for (let elem of arr) {
        		if ( callback(elem) === true ) {
        			res.push(elem);
        		}
        	}

        	return res;
        }

        let result = filter([1, 2, 3, 4, 5], elem => elem > 0);

        console.log(result);
        }
